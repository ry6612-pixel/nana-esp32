# SerialSoul — ESP32-S3 Standalone AI Assistant
# Natural language programming. No computer needed.
#
# Prerequisites: espup (cargo install espup; espup install)
# Build: cargo build --release
# Flash: espflash flash --monitor -p COM5 target/xtensa-esp32s3-espidf/release/esp32

[package]
name = "esp32"
version = "5.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SerialSoul — Your $10 AI Assistant. Program by typing plain sentences. ESP32-S3 + Gemini. No computer needed."

[dependencies]
esp-idf-sys = "0.37.2"
esp-idf-svc = { version = "0.52.1", features = ["std"] }
esp-idf-hal = "0.46.2"
embedded-svc = "0.28"
embedded-hal = "1.0"
embedded-graphics = "0.8"
display-interface-spi = "0.5"
mipidsi = "0.8"
embedded-io = "0.6"
nanomp3 = "0.1.1"
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
esp32-nimble = "0.12"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# ESP-IDF 版本必須釘死。不釘的話 esp-idf-sys 每次改版都可能換掉預設版本,
# 同一份原始碼在不同機器/不同時間編出來的韌體就不一樣 —— 而且失敗模式極隱蔽
# (見 sdkconfig.defaults 的 SCCB 段:5.3 以上會在 app_main 之前 abort,無任何 log)。
# 釘 v5.2.3 是因為這是目前實機反覆驗證過的版本;要升版是獨立工程,升完必須重測
# camera / esp-sr / nimble 三個元件。
# 注意是單括號的一般表,不是 [[...]] 陣列表 —— 寫成陣列表 TOML 本身合法,
# 但 esp-idf-sys 讀不到,連帶下面的 extra_components 也會失效,症狀是相機元件
# 沒被啟用、所有 #[cfg(esp_idf_comp_...esp32_camera_enabled)] 區塊消失,
# 編譯冒出一堆看不出關聯的型別推斷錯誤。
[package.metadata.esp-idf-sys]
esp_idf_version = "v5.2.3"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "2.1.5" }
bindings_header = "camera_bindings.h"
bindings_module = "camera"

[[package.metadata.esp-idf-sys.extra_components]]
# 釘死精確版本,不用 ^ 範圍 —— 元件版本漂移跟 ESP-IDF 版本漂移是同一類問題:
# 換一台機器、隔一段時間重編,拉到的就可能是不同版本。實際解析到的是 2.4.6。
remote_component = { name = "espressif/esp-sr", version = "2.4.6" }
bindings_header = "sr_bindings.h"
bindings_module = "sr"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = "s"

[workspace]
